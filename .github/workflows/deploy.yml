name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]

  # Permite ejecutar esto manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos para que GitHub Actions pueda publicar en las páginas del repositorio
permissions:
  contents: read
  pages: write
  id-token: write

# Solo permite un despliegue concurrente, evitando carreras de subida
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
   steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Asegúrate de que esta sea tu carpeta de salida generada

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4